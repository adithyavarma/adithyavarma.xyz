<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Reservation</title>
</head>
<body>
<h2>Restaurant Reservation</h2>
<form id="reservation-form">
    <input type="text" id="name" placeholder="Your Name" required><br>
    <input type="text" id="phone" placeholder="Phone Number" required><br>
    <input type="date" id="date" required><br>
    <input type="number" id="guests" placeholder="Number of Guests" min="1" required><br>
    <input type="text" id="reservedBy" placeholder="Reserved By" required><br>
    <button type="submit">Submit</button>
</form>

<script>
    document.getElementById("reservation-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const dateOfReservation = document.getElementById("date").value;
        const numberOfPeople = document.getElementById("guests").value;
        const reservedBy = document.getElementById("reservedBy").value;

        const response = await fetch("https://your-render-app-url.onrender.com/reserve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, phone, dateOfReservation, numberOfPeople, reservedBy })
        });

        const result = await response.json();
        alert(result.message);
        document.getElementById("reservation-form").reset();
    });
</script>
</body>
</html>
