<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Reservation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <header class="header">
        <h1>RESTAURANT RESERVATION SYSTEM</h1>
        <h5>Customer View</h5>
    </header>
    <form class="form-container" id="reservation-form">
        <label>Customer Name:</label>
        <input type="text" id="name" required><br>
        <label>Customer Phone Number:</label>
        <input type="text" id="phone" required><br>
        <label>Date and Time of Reservation:</label>
        <input type="datetime-local" id="dateTime" required><br>
        <label>Number of Guests:</label>
        <input type="number" id="guests" min="1" required><br>
        <label>Reserved By:</label>
        <input type="text" id="reservedBy" placeholder="employee name" required><br>
        <button type="submit">SUBMIT</button>
    </form>
</div>
<script>
    document.getElementById("reservation-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const dateOfReservation = new Date(document.getElementById("dateTime").value).toISOString();
        const numberOfPeople = document.getElementById("guests").value;
        const reservedBy = document.getElementById("reservedBy").value;

        const response = await fetch("https://your-render-app-url.onrender.com/reserve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, phone, dateOfReservation, numberOfPeople, reservedBy })
        });

        const result = await response.json();
        alert(result.message);
        document.getElementById("reservation-form").reset();
    });
</script>
</body>
</html>
