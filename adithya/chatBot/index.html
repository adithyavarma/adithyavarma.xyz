<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot - Adithya</title>
    <link rel="stylesheet" href="adithya/chatBot/style.css">
</head>
<body>
<div class="container">
    <header class="header">
        <h1>Adithya ChatBot</h1>
    </header>
    <div class="chat-container">
        <div class="chat-box" id="chat-box"></div>
        <div class="user-input-container">
            <input type="text" id="user-input" placeholder="Ask me anything..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>
<script src="adithya/chatBot/script.js"></script>
</body>
</html>
